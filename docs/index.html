<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Core Theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">

  <!--
  Dark Theme (add-on)
  -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/core-dark.min.css" />

  <!-- Custom Settings -->
  <style>
    :root {
      --code-color: #ffff00;
      --font-weight: 400;
      --blockquote-color: var(--color-text);
      --link-color: var(--theme-color);
      --link-color-hover: #E96900;
      --content-max-width: 80%;
    }

    /* responsive design */
    @media (min-width: 769px) {
      .markdown-section>*:not(table) {
        max-width: 75% !important;
      }

      .markdown-section {
        margin-inline: 150px auto !important;
      }

      .markdown-section hr {
        margin-left: 0 !important;
      }
    }

    .markdown-section a {
      text-decoration: none !important;
    }

    .sidebar a,
    .app-nav a {
      text-decoration: none !important;
    }

    .sidebar a:hover,
    .app-nav a:hover {
      color: var(--link-color-hover) !important;
    }

    .markdown-section img:not(.emoji) {
      margin-top: 10px !important;
      margin-bottom: 10px !important;
      display: block;
    }

    .markdown-section table tr:nth-child(2n) {
      background-color: transparent !important;
    }

    .markdown-section th,
    .markdown-section td {
      text-align: center !important;
      vertical-align: middle !important;
    }

    .markdown-section table code {
      white-space: nowrap !important;
    }
  </style>
</head>

<body class="sidebar-toggle-chevron sidebar-chevron-right sidebar-group-box">
  <div id="app"></div>

  <!-- Configuration -->
  <script>
    window.$docsify = {
      name: 'Conventions',
      repo: 'https://github.com/arthousedotexe/music-library-conventions',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 2,
      search: {
        insertAfter: '.app-name',
        namespace: 'docs',
        paths: 'auto',
        placeholder: {
          '/ru-ru/': 'Поиск',
          '/': 'Search',
        },
        noData: {
          '/ru-ru/': 'Ничего не найдено!',
          '/': 'Nothing found!',
        },
        depth: 2,
      },

      plugins: [
        function pageFooter(hook, vm) {
          hook.afterEach(function (html) {
            // get current path and check it if we are in 'ru-ru' dir
            const currentPath = vm.route ? vm.route.path : window.location.hash;
            const isRU = currentPath.includes('/ru-ru/');

            const footerEN = `
              <hr/>
              <footer>
                <span>Content is dedicated to the public domain under the <a href="https://creativecommons.org/publicdomain/zero/1.0/" target="_blank">CC0 1.0 Universal license</a>.</span><br>
                <span>No rights reserved.</span><br>
                <span><a href="https://arthousedotexe.github.io/music-library-conventions/#/">https://arthousedotexe.github.io/music-library-conventions/#/</a></span>
              </footer>
            `;

            const footerRU = `
              <hr/>
              <footer>
                <span>Контент передан в общественное достояние на условиях лицензии <a href="https://creativecommons.org/publicdomain/zero/1.0/deed.ru" target="_blank">CC0 1.0 Universal license</a>.</span><br>
                <span>Никаких авторских прав не сохраняется.</span><br>
                <span><a href="https://arthousedotexe.github.io/music-library-conventions/#/">https://arthousedotexe.github.io/music-library-conventions/#/</a></span>
              </footer>
            `;

            return html + (isRU ? footerRU : footerEN);
          });
        },
      ],
    }
  </script>

  <!-- Docsify v5 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>

  <!-- Search Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
</body>

</html>
